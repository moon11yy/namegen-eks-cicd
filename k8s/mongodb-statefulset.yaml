apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: namegen
spec:
  serviceName: mongodb
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:3.6
          imagePullPolicy: IfNotPresent

          ports:
            - name: mongodb
              containerPort: 27017

          env:
            - name: MONGO_INITDB_DATABASE
              value: namegen

            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_USERNAME

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_PASSWORD

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

            - name: mongodb-init
              mountPath: /docker-entrypoint-initdb.d/mongo-init.sh
              subPath: mongo-init.sh
              readOnly: true

          readinessProbe:
            exec:
              command:
                - mongo
                - --quiet
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

      volumes:
        - name: mongodb-init
          configMap:
            name: mongodb-init
            defaultMode: 0755

  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        storageClassName: auto-ebs-sc
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
