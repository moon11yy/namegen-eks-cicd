apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: namegen
data:
  mongo-init.sh: |
    #!/bin/bash
    set -e

    mongo namegen <<MONGOEOF
    db.createUser({
      user: "${MONGO_USERNAME}",
      pwd: "${MONGO_PASSWORD}",
      roles: [
        {
          role: "readWrite",
          db: "namegen"
        }
      ]
    });
    MONGOEOF
