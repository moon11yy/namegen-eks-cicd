apiVersion: apps/v1
kind: Deployment
metadata:
  name: namegen-app
  namespace: namegen

spec:
  replicas: 2

  selector:
    matchLabels:
      app: namegen-app

  template:
    metadata:
      labels:
        app: namegen-app

    spec:
      containers:
      - name: namegen-app

        image: 233231934984.dkr.ecr.eu-central-1.amazonaws.com/namegen-app:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        env:
        - name: MONGODB_URL
          value: mongodb://genuser:password@mongodb/namegen
