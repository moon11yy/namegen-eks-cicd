apiVersion: apps/v1
kind: Deployment
metadata:
  name: namegen-app
  namespace: namegen
spec:
  replicas: 2

  selector:
    matchLabels:
      app: namegen-app

  template:
    metadata:
      labels:
        app: namegen-app
    spec:
      containers:
        - name: namegen-app
          image: 233231934984.dkr.ecr.eu-central-1.amazonaws.com/namegen-app:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_URL

          readinessProbe:
            httpGet:
              path: /api/connection
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
