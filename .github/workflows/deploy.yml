name: Build and Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: "233231934984"
  ECR_REPOSITORY: namegen-app
  EKS_CLUSTER_NAME: namegen-eks
  K8S_NAMESPACE: namegen
  DEPLOYMENT_NAME: namegen-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::233231934984:role/GitHubActionsNamegenRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Deploy image to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image \
            deployment/$DEPLOYMENT_NAME \
            namegen-app="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --namespace "$K8S_NAMESPACE"

          kubectl rollout status \
            deployment/$DEPLOYMENT_NAME \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m

      - name: Show deployment status
        run: |
          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -o wide

          kubectl get service namegen-service \
            --namespace "$K8S_NAMESPACE"
